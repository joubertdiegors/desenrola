{% load i18n %}{% comment %}
Barra inferior do celular (layouts 1n e 1q): 3 destinos, ativo no acento
com icone preenchido. Contexto: active_nav ("home" | "letters" | "profile").
{% endcomment %}
<nav class="tabbar m-only" aria-label="{% translate 'Navegação' %}">
  <a href="{% url 'core:dashboard' %}"{% if active_nav == "home" %} aria-current="page"{% endif %}><i class="{% if active_nav == 'home' %}ph-fill{% else %}ph{% endif %} ph-house" aria-hidden="true"></i>{% translate "Início" %}</a>
  <a href="{% url 'core:dashboard' %}#minhas-cartas"{% if active_nav == "letters" %} aria-current="page"{% endif %}><i class="{% if active_nav == 'letters' %}ph-fill{% else %}ph{% endif %} ph-files" aria-hidden="true"></i>{% translate "Cartas" %}</a>
  <a href="{% url 'accounts:profile' %}"{% if active_nav == "profile" %} aria-current="page"{% endif %}><i class="{% if active_nav == 'profile' %}ph-fill{% else %}ph{% endif %} ph-user" aria-hidden="true"></i>{% translate "Perfil" %}</a>
</nav>
