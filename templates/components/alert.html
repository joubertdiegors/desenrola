{% comment %}
Aviso do sistema. kind: success | warning | error | info (padrao).
Uso: {% include "components/alert.html" with kind="success" title="Carta gerada." text="Você pode baixar o PDF." %}
{% endcomment %}<div class="notice{% if kind and kind != 'info' %} notice-{{ kind }}{% endif %}" role="{% if kind == 'error' %}alert{% else %}status{% endif %}">
  <i class="ph-fill {% if kind == 'success' %}ph-check-circle{% elif kind == 'warning' %}ph-warning{% elif kind == 'error' %}ph-x-circle{% else %}ph-info{% endif %}" aria-hidden="true"></i>
  <span>{% if title %}<strong>{{ title }}</strong> {% endif %}{{ text }}</span>
</div>
