{% load i18n static %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Desenrola{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'core:home' %}">Desenrola</a>

    <form action="{% url 'set_language' %}" method="post" class="lang-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.path }}">
      <select name="language" onchange="this.form.submit()" aria-label="{% translate 'Idioma' %}">
        {% get_current_language as CURRENT %}
        {% get_available_languages as LANGUAGES %}
        {% for code, name in LANGUAGES %}
          <option value="{{ code }}"{% if code == CURRENT %} selected{% endif %}>{{ code|upper }}</option>
        {% endfor %}
      </select>
    </form>
  </header>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
