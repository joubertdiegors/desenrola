{% load i18n %}{% comment %}
Como funciona -- os passos que explicam o servico.

Contexto: secoes.how.
{% endcomment %}
<section class="section container" id="como-funciona">
  <h2>{{ secoes.how.title }}</h2>
  <p class="section-lead">{{ secoes.how.lead }}</p>
  <div class="how-grid">
    {% for card in secoes.how.cards %}
    <div class="card how-card">
      <span class="tint how-card-icon"><i class="ph {{ card.icon }}" aria-hidden="true"></i></span>
      <h3>{{ card.title }}</h3>
      <p class="text-muted">{{ card.text }}</p>
    </div>
    {% endfor %}
  </div>
</section>
